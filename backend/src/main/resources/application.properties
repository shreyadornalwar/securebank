server.port=${PORT:8080}

# H2 file-based database (persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/securebank;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.jdbc-url=jdbc:h2:file:./data/securebank;AUTO_SERVER=TRUE

# Completely disable SQL init - we use DatabaseInitializer
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.sql.init.mode=never

