server.port=${PORT:8080}

# Database Configuration - PostgreSQL for production (Render), H2 for local development
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.jdbc-url=${DATABASE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1}

# PostgreSQL specific settings (only used when DATABASE_URL is PostgreSQL)
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update

# SQL init
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.jpa.show-sql=false
spring.h2.console.enabled=false

