server.port=${PORT:8080}

# Database Configuration - H2 File-based for persistence
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/securebank;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.jdbc-url=${DATABASE_URL:jdbc:h2:file:./data/securebank;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}

# PostgreSQL specific settings (only used when DATABASE_URL is PostgreSQL)
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update

# SQL init
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Email Configuration (Gmail with App Password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=shreyadornalwar@gmail.com
spring.mail.password=YOUR_NEW_APP_PASSWORD
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.debug=true

# Debug
logging.level.org.springframework.mail=DEBUG
logging.level.com.bank.service.EmailService=DEBUG
