server.port=${PORT:8080}

# Database configuration - Using custom env vars with unique prefix
spring.datasource.url=${MYAPP_DB_URL:jdbc:postgresql://localhost:5432/bankdb}
spring.datasource.username=${MYAPP_DB_USER:postgres}
spring.datasource.password=${MYAPP_DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

logging.level.com.bank=DEBUG

# Google OAuth Configuration
spring.security.oauth2.client.registration.google.client-id=1064563877288-vms8h9o0hj3k8cj4f8fj4h9g4fj2.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=dummy-secret-for-dev
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=https://securebank-backend-rc4i.onrender.com/login/oauth2/code/google
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
