server.port=${PORT:8080}

# Database configuration with fallback for Render
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/bankdb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:password}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Hibernate will auto-create/update tables
spring.jpa.hibernate.ddl-auto=update

# SQL initialization - set to 'never' to skip schema/data scripts if they cause issues
# Change to 'always' once database is properly reset
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=false
